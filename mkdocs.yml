site_name: "Imperata Praedari: Academia et Illustria"
site_url: https://unta-makan-kesehatan.github.io/Imperata-Praedari-Academia-et-Illustria/

theme:
  name: material
  font: false
  icon:
    logo: material/compass-rose
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
  palette:
    scheme: slate

nav:
  - The World of Avara: world.md

  - Mana & Praedari:
      - Overview: mana.md
      - Praedari Disciplines: "praedari disciplines.md"
      - Magic Item Classification: "magic item classification.md"

  - Races:
      - The Races of Avara: races.md
      - Humans: Races/humans.md
      - Halflings: Races/halflings.md
      - Goliaths: Races/goliaths.md
      - Half-Orcs and Half-Elves: "Races/half orcs & half elves.md"
  - The Gods: the gods.md
  
markdown_extensions:
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/invitation.js
  - javascripts/transitions.js
