site_name: "Imperata Praedari: Academia et Illustria"
site_url: https://unta-makan-kesehatan.github.io/Imperata-Praedari-Academia-et-Illustria/

theme:
  name: material
  font: false
  icon:
    logo: material/compass-rose
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
  palette:
    scheme: slate

nav:
  - The World of Avara: world.md

  - Mana & Praedari:
      - Overview: mana.md
      - Praedari Disciplines: "praedari disciplines.md"
      - Magic Item Classification: "magic item classification.md"

  - The Gods: the gods.md
  - Races: races.md
  
markdown_extensions:
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/invitation.js
  - javascripts/transitions.js
